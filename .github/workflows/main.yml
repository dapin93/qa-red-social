name: Pruebas Automatizadas Cypress
on: [push, pull_request]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3
      - name: Ejecutar pruebas de Cypress en la nube
        uses: cypress-io/github-action@v5
        with:
          build: npm run build
          start: npm start
